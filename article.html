<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — Grace & Truth</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html">Grace & Truth<small>Christian reflections</small></a><nav class="nav-links"><a href="index.html">Home</a><a href="articles.html">Articles</a><a href="categories.html">Categories</a><a href="about.html">About</a></nav><button class="menu-btn" aria-label="Open menu" aria-expanded="false"><span></span></button></div></header><main class="article-shell"><div id="article"></div></main><footer class="footer"><div class="container"><div class="copyright">© 2026 Your Client Name.</div></div></footer><script src="assets/site.js"></script><script>const id=new URLSearchParams(location.search).get('id');const a=getArticles().find(x=>x.id===id)||getArticles()[0];document.title=a.title+' — Grace & Truth';document.getElementById('article').innerHTML=`<div class="kicker">${esc(a.category)}</div><h1 class="article-title">${esc(a.title)}</h1><p class="article-deck">${esc(a.excerpt)}</p><div class="article-author"><div class="avatar">YN</div><div><strong>Your Client Name</strong><div class="meta">${esc(a.date)}</div></div></div><div class="article-content"><p>Faith often grows through attention — to Scripture, to the quiet movements of the heart, and to the ordinary places where God meets us.</p><p>This page is designed as a calm reading space where the writer can share longer reflections without visual clutter. In the live CMS, every paragraph, heading, quotation, image, and Scripture reference will come directly from the article created in the backend.</p><h2>Space to read slowly</h2><p>The page keeps the reading column intentionally focused, with generous spacing and balanced typography so longer articles remain comfortable on both desktop and mobile.</p><div class="pullquote">“The aim is not only to publish more words, but to make space for readers to slow down and reflect.”</div><p>The final system can also support Scripture references, block quotes, images, headings, related articles, SEO descriptions, scheduled publishing, and draft status.</p></div>`;</script></body></html>
