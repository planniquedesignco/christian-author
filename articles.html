<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles — Grace & Truth</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html">Grace & Truth<small>Christian reflections</small></a><nav class="nav-links"><a href="index.html">Home</a><a href="articles.html">Articles</a><a href="categories.html">Categories</a><a href="about.html">About</a></nav><button class="search-trigger">Search articles</button><button class="menu-btn">☰</button></div></header>
<section class="page-hero"><div class="container"><div class="kicker">Library</div><h1>Articles</h1><p>Browse all reflections, filter by category, or search by title and subject.</p><div class="filters"><button class="filter active" data-cat="All">All</button><button class="filter" data-cat="Faith & Life">Faith & Life</button><button class="filter" data-cat="Bible & Theology">Bible & Theology</button><button class="filter" data-cat="Prayer">Prayer</button><button class="filter" data-cat="Church & Community">Church & Community</button></div><div style="margin-top:18px"><input id="search" placeholder="Search articles..." style="width:min(100%,520px);padding:12px 15px;border:1px solid var(--line);border-radius:999px;background:#fff"></div></div></section>
<section class="section"><div class="container"><div class="article-grid" id="grid"></div></div></section>
<footer class="footer"><div class="container"><div class="copyright">© 2026 Your Client Name.</div></div></footer><script src="assets/site.js"></script><script>let cat='All';const grid=document.getElementById('grid'),search=document.getElementById('search');function draw(){const q=search.value.toLowerCase();renderArticleGrid(grid,getArticles().filter(a=>(cat==='All'||a.category===cat)&&(`${a.title} ${a.excerpt} ${a.category}`.toLowerCase().includes(q))))};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;draw()});search.oninput=draw;draw();</script></body></html>
