<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CMS Demo — Grace & Truth</title><link rel="stylesheet" href="assets/styles.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html">Grace & Truth<small>CMS demo</small></a><div style="font-size:.85rem;color:var(--muted)">Frontend preview ↗</div></div></header><div class="admin-wrap"><aside class="admin-sidebar"><strong style="display:block;margin:0 12px 16px">Content</strong><a class="active">Articles</a><a>Categories</a><a>Author Profile</a><a>Site Settings</a></aside><main class="admin-main"><div class="admin-top"><div><div class="kicker">Simple CMS</div><h1>Manage articles</h1></div><a class="btn ghost" href="index.html">View website</a></div><div class="panel"><form id="form"><input type="hidden" id="editId"><div class="form-grid"><div class="field"><label>ARTICLE TITLE</label><input id="title" required placeholder="Article title"></div><div class="field"><label>CATEGORY</label><input id="category" list="cats" required placeholder="Choose or type a new category"><datalist id="cats"><option>Faith & Life</option><option>Bible & Theology</option><option>Prayer</option><option>Church & Community</option></datalist></div><div class="field"><label>PUBLISH DATE</label><input id="date" required placeholder="September 23, 2026"></div><div class="field"><label>READ TIME</label><input id="read" value="5 min read"></div><div class="field full"><label>SHORT EXCERPT</label><textarea id="excerpt" style="min-height:90px" required placeholder="Short summary shown on article cards"></textarea></div><div class="field full"><label>ARTICLE CONTENT</label><textarea id="content" placeholder="In the production backend this becomes a rich-text editor for headings, Scripture references, images, quotes, links and formatting."></textarea></div></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn primary" type="submit">Save article</button><button class="btn ghost" type="button" id="cancel">Clear form</button></div></form></div><div class="panel admin-list"><strong>Published articles</strong><div id="list"></div></div></main></div><script src="assets/site.js"></script><script>
const form=document.getElementById('form'), list=document.getElementById('list');function slug(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now().toString()}function refresh(){const data=getArticles();list.innerHTML=data.map(a=>`<div class="admin-item"><div><strong>${esc(a.title)}</strong><div class="meta">${esc(a.category)} · ${esc(a.date)}</div></div><div class="admin-actions"><button class="small-btn" onclick="editA('${a.id}')">Edit</button><button class="small-btn" onclick="delA('${a.id}')">Delete</button></div></div>`).join('')}function clearF(){form.reset();document.getElementById('editId').value='';document.getElementById('read').value='5 min read'}window.editA=id=>{const a=getArticles().find(x=>x.id===id);if(!a)return;['title','category','date','read','excerpt'].forEach(k=>document.getElementById(k).value=a[k]||'');document.getElementById('editId').value=a.id;scrollTo({top:0,behavior:'smooth'})};window.delA=id=>{if(!confirm('Delete this article?'))return;saveArticles(getArticles().filter(a=>a.id!==id));refresh()};form.onsubmit=e=>{e.preventDefault();let data=getArticles(),id=document.getElementById('editId').value||slug(document.getElementById('title').value);const obj={id,title:document.getElementById('title').value,category:document.getElementById('category').value,date:document.getElementById('date').value,read:document.getElementById('read').value,excerpt:document.getElementById('excerpt').value};const i=data.findIndex(a=>a.id===id);if(i>=0)data[i]={...data[i],...obj};else data.unshift(obj);saveArticles(data);clearF();refresh();alert('Saved. In this demo it is stored in this browser. Production will use the real online database.')};document.getElementById('cancel').onclick=clearF;refresh();
</script></body></html>
